<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- No remote anything. The overlay sits on top of whatever the user is doing,
		     which is the last place that should be able to load a script from a URL. -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
		/>
		<title>Screen Angel</title>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
