relation_to_soul_angel:
  decided: "2026-09-10 — Screen Angel names the layer. Soul Angel names the game application built on it."

  the_ladder:
    # Each rung is the beachhead of the rung below it. Don's term.
    screen_angel:
      is: "The layer. Selectors, event bindings and hybrid recognition over any application's interface."
      scope: "Any app on any platform, soulful or soulless. Microsoft Word counts."
    soul_angel:
      is: "Screen Angel's first application — the one that carries souls out of games."
      why_first: |
        Games are the hardest target: no accessibility tree at all, so the pixel path carries the
        whole load. If the layer works here it works anywhere, which is the definition of a good
        beachhead — not the easiest landing, the one that proves the rest.
    sims1:
      is: "Soul Angel's first application."
      why_first: |
        A twenty-six-year-old game with a live community, a known file format, an owner who has
        stopped maintaining it, and characters people still care about. Everything Soul Angel
        claims has to be true here before it is claimed anywhere else.

  beachhead: |
    The word for the relationship between rungs. A beachhead is not the destination and not a
    demo — it is a real position taken and held, from which the general case becomes reachable.
    The Sims 1 is Soul Angel's beachhead; Soul Angel is Screen Angel's.

  shared: |
    The Electron host with capture and accessibility addons IS the Screen Angel shell. The family
    album for a game that has never heard of us IS the pixel-recognition path. The per-game
    Soul Bridge IS the per-application plugin.
  where: "../ARCHITECTURE.yml, ../GAME-BRIDGES.yml"

  one_angel_rule: |
    The August 2026 naming rule said one Angel in the family — the sims1 module is a Bridge, not
    a second Angel. That rule stands. It was about not multiplying angels at the SAME layer.
    Screen Angel sits one layer below Soul Angel, so the family has exactly two angels at two
    layers and no siblings at either. Bridges are still bridges.

