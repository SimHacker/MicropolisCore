# soul-angel — the Screen Angel module that knows the app is watching a game
# about people. A module, not an application: the shell, recorder, bus and
# grants belong to the app upstairs. Read order: README.md -> ARCHITECTURE.yml
# -> SOUL-ALBUM.yml -> DVR.yml -> SOUL-BRIDGE-SDK.yml -> GAME-BRIDGES.yml ->
# SOUL-EMIGRATION.yml -> UNIVERSAL-JOBS.yml -> OUT-OF-GAME-JOBS.yml

module:
  id: soul-angel
  status: spec
  of_app: ../../SCREEN-ANGEL.yml
  # LICENSE.md — build on it, plug into it; commercial rights reserved
  license: source_available
  # app level; this module is not sold separately
  product_and_pricing: ../../DISTRIBUTION.yml
  purpose: >-
    Universal Soul Album + per-game Soul Bridges + jobs, errands and emigration
    — the soul half of Screen Angel

architecture: >-
  Save parsers are pure functions over buffers; bridges ask the app for grants
  and never for paths. The Electron host, overlay, capture and bus are the app's
  (ARCHITECTURE.yml, moved_up)

what_you_get:   # keyed by what the game has to give up for it
  needs_nothing_from_the_game: >-
    Scrub-to-card album, narration, jobs with no bridge at all — on top of the
    app's ring buffer and stream output (../../RECORDER.yml)
  needs_a_per_game_plugin: >-
    A Soul Bridge: read and write the game's saves and its own album format (The
    Sims 1 first, Sims 4 with modder help)
  needs_a_soul_city_account: >-
    Publish to Soul City Broadcast Network — TV / radio / magazine channels

emigration: >-
  Souls leave games — enumerate, export, optional player-authored farewell,
  replant (Tiny Life first)

# WWSFF apps/stream-gateway specs -> broadcast sinks here, bus at app level
subsumes: stream-gateway

specs:
  overview: README.md
  # what this module owns, and where each app-level concern moved
  architecture: ARCHITECTURE.yml
  # story cards, provenance, narration, game-album bridging
  album: SOUL-ALBUM.yml
  # what a recording MEANS in a game about people; privacy and redaction rules
  dvr: DVR.yml
  # per-game plugin interface — FileBridge scoped, overlay-hosted
  bridges: SOUL-BRIDGE-SDK.yml
  # which games, in what order, and what every other game still gets
  roster: GAME-BRIDGES.yml
  # export/farewell/replant ritual; object packs and their positioning rule
  emigration: SOUL-EMIGRATION.yml
  # the layer this module is the first application of; named aQuery 2013-2026
  screen_angel: ../../SCREEN-ANGEL.yml
  # the app this module runs inside — start there for the full spec map
  host_app: ../../README.md
  license: ../../LICENSE.md

show_side:   # product/community framing lives in WWSFF
  product_spec: WillWrightShowForFood/catalogs/soul-city/soul-angel.yml
  broadcast_network: WillWrightShowForFood/apps/soul-angel/SCBN.yml
  windows_host_specs: WillWrightShowForFood/apps/soul-angel/windows/
