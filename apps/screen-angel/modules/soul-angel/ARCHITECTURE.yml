# Soul Angel architecture — what this MODULE is, now that the app around it exists.
#
# This file used to be an application architecture, because Soul Angel used to be the
# application. Screen Angel is the app; Soul Angel is the module that knows the app is looking at
# a game about people. Everything here that was about hosting a browser, capturing a window or
# encoding video has moved up, and this file says where.

meta:
  id: soul-angel-architecture
  status: spec
  parent: ../../SCREEN-ANGEL.yml
  see_also: [GLANCE.yml, SOUL-ALBUM.yml, SOUL-BRIDGE-SDK.yml, GAME-BRIDGES.yml, SOUL-EMIGRATION.yml, UNIVERSAL-JOBS.yml, OUT-OF-GAME-JOBS.yml, DVR.yml, LICENSE.md]

# WHAT THIS MODULE OWNS
#
# The test for every line: would it still be true if the app were pointed at a spreadsheet?
# If yes, it is not this module's business.

owns:
  soul_bridges: "Per-game TypeScript plugins, hot-swapped on game focus, and the SDK they are written against (SOUL-BRIDGE-SDK.yml, GAME-BRIDGES.yml)."
  save_formats: "Reading and writing game saves, in TypeScript and wasm, through the app's scoped file grants. The parsers are pure functions; the grants are not ours."
  the_album: "Cards, provenance, narration, the publish pipeline (SOUL-ALBUM.yml)."
  jobs_and_errands: "Characters holding jobs at the host layer, and characters sent into other games (UNIVERSAL-JOBS.yml, OUT-OF-GAME-JOBS.yml)."
  emigration: "Leaving, arriving, and the ethics of both (SOUL-EMIGRATION.yml)."
  federation_sync: "Publishing albums into Soul City and pulling community content back."
  the_soul_domain: "Which events mean something in a game about people, published under soul.* on the app's bus — soul.bridge.data, soul.character.event, soul.album.published, soul.character.enumerated."
  the_semantics_of_a_recording: "The app records pixels on a clock. This module knows the thing recorded was a wedding and who to credit (UNIVERSAL-JOBS.yml, the_semantic_video_recorder)."

moved_up:
  why: "None of it was soul-specific. A notification fabric, a ring buffer, a transparent window and a capture addon are the same whatever the app is looking at, and keeping a second copy here is how two implementations get built."
  the_shell_and_the_overlay: "Electron host, transparent always-topmost window, click-through mask and hit testing, fullscreen fallbacks, per-platform notes, the Kando precedent, and the superseded WinUI prototype — ../../SCREEN-ANGEL.yml, implementation.shell."
  capture_encode_and_the_ring: "Window capture per platform, hardware encode, the ring buffer, composite modes, OBS and RTMP output — ../../RECORDER.yml."
  the_event_bus: "The Angel Event Bus, its naming grammar and its one clock — ../../ANGEL-EVENT-BUS.yml."
  grants_and_permissions: "Scoped filesystem grants, OS permission prompts, what a module may reach — ../../CAPABILITIES.yml and ../../MODULES.yml, trust_boundary."
  driving_other_programs: "Input synthesis, save-quit-edit-relaunch choreography, view-state restore — ../../APP-CONTROL.yml."
  reading_the_screen: "Accessibility trees where they exist, OCR and recognition where they do not — ../../ACCESSIBLIFY.yml."
  packaging: "Installers, notarization, Steam coexistence, what is free — ../../DISTRIBUTION.yml, ../../STEAMWORKS.yml."
  the_redaction_gate: "App level, because it has to cover every sink. What must be redacted in a game about people is still ours (DVR.yml, privacy)."

# THE ONE ARCHITECTURAL RULE THAT IS THIS MODULE'S OWN

parsers_are_pure:
  the_rule: "Every save format parser is a pure function over buffers. No file handles, no paths, no platform calls anywhere above the byte layer."
  why_it_is_not_style: "It is what lets the same bridge code run in the desktop app, in a browser tab, in a test with a fixture file, and inside an emulator's memory — the same discipline as the Apple ][ ladder, where only L0 touches I/O (documentation/designs/apple-ii-floppy-bridge.md)."
  and_the_corollary: "A bridge that needs a path is asking the app for a grant, not reaching for a file. That is the boundary that makes third-party bridges possible at all."

non_destructive:
  the_rule: "A bridge never writes over the only copy. Read, patch, keep the original, report what changed."
  where_the_protocol_lives: "moollm skills/soul-city/SOUL-BRIDGES.md. This module implements it; it does not define it."

lineage:
  from: "WWSFF apps/soul-angel/ — the Soul Angel application specs, including apps/soul-angel/windows/ for the Windows host and the Sims 1 bridge, and catalogs/soul-city/soul-angel.yml for the catalogue entry."
  what_changed: "It stopped being an application. The soul-specific half became this module; the general half became the app it now runs inside."
  the_broadcast_network: "WWSFF apps/soul-angel/SCBN.yml — the Soul City Broadcast Network channels, which UNIVERSAL-JOBS.yml publication surfaces line up with."
